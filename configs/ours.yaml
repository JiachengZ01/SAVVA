# AdaVBoost Configuration
#
# VGE = alpha * entropy + (1 - alpha) * (1 - G)
# Visual boost: attention × m_t, where m_t = 1 + (m_max_visual - 1) * risk
# Text suppress: attention × 1/m_max_text

strategy: adavboost

models:
  llava:
    vge:
      alpha: 0.65
      risk_scale: 0.50
    layers:
      start: 0
      end: 15
    m:
      max_visual: 1.1
      max_text: 1.7

  qwen:
    vge:
      alpha: 0.8
      risk_scale: 0.60
    layers:
      start: 4
      end: 15
    m:
      max_visual: 1.3
      max_text: 1.3

  internvl:
    vge:
      alpha: 0.55
      risk_scale: 0.70
    layers:
      start: 4
      end: 15
    m:
      max_visual: 1.3
      max_text: 1.6
